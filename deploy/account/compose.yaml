name: apell-account-logto

services:
  account:
    image: ghcr.io/logto-io/logto:1.46.0@sha256:d5e208ce705cbcf7c79ddba421216eb65413d0b0531aa658fb22a4ba659be983
    entrypoint:
      - sh
      - -ec
      - |
        password=$$(node -p 'encodeURIComponent(process.env.ACCOUNT_DB_PASSWORD)')
        export DB_URL="postgresql://logto:$$password@db:5432/logto"
        unset password ACCOUNT_DB_PASSWORD
        npm run cli db seed -- --swe
        exec npm start
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ACCOUNT_PORT:-5656}:3001'
      - '127.0.0.1:${ACCOUNT_ADMIN_PORT:-3002}:3002'
    environment:
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      ENDPOINT: ${ACCOUNT_ENDPOINT:?Set ACCOUNT_ENDPOINT}
      ADMIN_ENDPOINT: 'http://127.0.0.1:${ACCOUNT_ADMIN_PORT:-3002}'
      TRUST_PROXY_HEADER: '1'
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]

  db:
    image: docker.io/library/postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, logto, -d, logto]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - logto_identity:/var/lib/postgresql/data
    networks: [database]

networks:
  frontend: {}
  database:
    internal: true

volumes:
  logto_identity:
