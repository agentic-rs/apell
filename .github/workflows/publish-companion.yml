name: Publish Companion

on:
  push:
    branches: [main]
    paths:
      - 'examples/chatbot/manifest.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-companion
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: 2
    outputs:
      artifact_id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test publishing client
        run: cargo test --locked -p apell-cli
      - name: Build Companion and its icon
        run: |
          pnpm build:chatbot
          pnpm exec tauri icon assets/companion.svg --output artifacts/companion-icons
      - name: Stage publishing files
        run: |
          mkdir -p release
          cp artifacts/chatbot.apel examples/chatbot/publish.json release/
          cp artifacts/companion-icons/128x128@2x.png release/icon.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: release
        with:
          name: companion-store-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
          digest-mismatch: error
      - uses: ./actions/publish
        with:
          store_url: ${{ vars.APELL_STORE_URL }}
          package: release/chatbot.apel
          metadata: release/publish.json
          icon: release/icon.png
