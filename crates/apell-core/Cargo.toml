[package]
name = "apell-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokn-sdk = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Keep rustls aligned with reqwest's preconfigured TLS backend.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
