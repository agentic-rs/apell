[package]
name = "apell-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokn-sdk = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tokn-accounts = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tokn-auth = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tokn-core = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tokn-convert = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tokn-provider-copilot = { git = "https://github.com/tokn-ai/tokn", branch = "main" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = "1"
unicase = "2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
# Keep rustls aligned with reqwest's preconfigured TLS backend.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
