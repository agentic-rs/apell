[package]
name = "apell-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apell-guest = { path = "../apell-guest" }
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }

[dev-dependencies]
apell-core = { path = "../apell-core" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
wat = "1"
