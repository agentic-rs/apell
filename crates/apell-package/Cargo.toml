[package]
name = "apell-package"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = "1"
unicase = "2"
unicode-normalization = "0.1"
