[workspace]
members = [
  "crates/apell-package",
  "crates/apell-store",
  "crates/apell-core",
  "crates/apell-speech",
  "crates/apell-guest",
  "crates/apell-runtime",
  "crates/apell-cli",
  "src-tauri",
  "src-tauri/plugins/tauri-plugin-apell-audio",
  "src-tauri/plugins/tauri-plugin-apell-credentials",
  "src-tauri/plugins/tauri-plugin-apell-sensors",
]
exclude = ["examples/chatbot", "vendor/whisper-rs-sys"]
resolver = "2"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
