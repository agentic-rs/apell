[package]
name = "chatbot"
version = "0.6.0"
edition = "2021"

[lib]
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
apell-guest = { path = "../../crates/apell-guest" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
